<style id="app-css">
/* Layout: cabeçalho da marca → barra fixa de busca e categorias → grade de itens em ladrilhos brancos → barra de orçamento flutuante */
:root{
  --bg:#0e0d0b; --surface:#181611; --surface-2:#221f18; --line:#332e24;
  --fg:#f4efe4; --muted:#a69d8c; --faint:#6f685b;
  --gold:#e9b13c; --gold-hi:#f8d77a; --turq:#33d2cf; --turq-ink:#06302f; --coral:#ff6e7c;
  --tile:#ffffff;
  --display:"Marcellus", "Cormorant Garamond", Georgia, serif;
  --body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 120px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--turq);outline-offset:2px;border-radius:6px}
.wrap{max-width:1120px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}

/* Cabeçalho */
.marca{display:flex;align-items:center;gap:16px;padding-block:22px 18px}
.marca img{width:72px;height:72px;border-radius:50%;flex:none;box-shadow:0 0 0 1px #000,0 6px 22px rgba(233,177,60,.18)}
.marca h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,6vw,40px);line-height:1.05;margin:0;letter-spacing:.01em;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold) 70%);-webkit-background-clip:text;background-clip:text;color:transparent;text-wrap:balance}
.marca p{margin:4px 0 0;color:var(--muted);max-width:60ch}
.aneis{height:6px;position:relative;margin:0}
.aneis::before,.aneis::after{content:"";position:absolute;left:0;right:0;height:2px;border-radius:2px}
.aneis::before{top:0;background:var(--turq)}
.aneis::after{top:4px;background:var(--coral)}
.contato{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding-block:12px 4px;color:var(--muted);font-size:14px}
.contato strong{color:var(--fg);font-weight:600;user-select:all}
.chip-link{display:inline-flex;align-items:center;gap:6px;color:var(--turq-ink);background:var(--turq);font-weight:700;
  padding:8px 14px;border-radius:999px;text-decoration:none;font-size:14px}

/* Barra de busca e categorias */
.filtros{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--bg);padding-block:12px 10px;
  margin-left:calc(-1 * max(16px, env(safe-area-inset-left, 0px)));margin-right:calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));border-bottom:1px solid var(--line)}
.busca{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.busca svg{flex:none;color:var(--faint)}
.busca input{flex:1;min-width:0;background:none;border:0;outline:none;padding:12px 0;font-size:16px}
.busca input::placeholder{color:var(--faint)}
.cats{display:flex;gap:8px;overflow-x:auto;padding-top:10px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;color:var(--muted);white-space:nowrap}
.cat span{color:var(--faint);margin-left:4px}
.cat[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#1d1503;font-weight:600}
.cat[aria-pressed="true"] span{color:#5a4410}

/* Seções e grade */
.secao{padding-top:26px}
.secao h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0 0 4px;color:var(--fg);text-wrap:balance}
.secao .sub{color:var(--faint);font-size:13px;margin:0 0 14px;letter-spacing:.04em;text-transform:uppercase}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px}
@media (max-width:420px){.grade{grid-template-columns:1fr 1fr;gap:10px}}
.card{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r);overflow:hidden;min-width:0;position:relative}
.card .tile{all:unset;cursor:pointer;display:block;background:var(--tile);aspect-ratio:1/1;max-width:100%}
.card .tile img{width:100%;height:100%;object-fit:contain;padding:12%;display:block}
.card .tile:focus-visible{outline:2px solid var(--turq);outline-offset:-2px}
.card .info{display:flex;flex-direction:column;gap:6px;padding:10px 12px 12px;flex:1}
.card .nome{all:unset;cursor:pointer;font-weight:600;font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.card .linha{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}
.preco{color:var(--gold-hi);font-weight:700;font-size:16px;white-space:nowrap}
.preco small{color:var(--faint);font-weight:500;font-size:12px;margin-left:3px}
.add{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:var(--turq);color:var(--turq-ink);display:grid;place-items:center}
.stepper{display:flex;align-items:center;background:var(--surface-2);border-radius:999px;border:1px solid var(--line)}
.stepper button{width:32px;height:32px;border:0;background:none;color:var(--turq);font-size:18px;font-weight:700;display:grid;place-items:center}
.stepper .qtd{width:44px;min-width:0;text-align:center;font-weight:700;font-size:16px;background:none;border:0;border-bottom:1px dashed var(--faint);border-radius:0;padding:4px 0;color:var(--fg)}
.stepper .qtd:focus{outline:none;border-bottom-color:var(--turq)}
.tag{position:absolute;top:8px;left:8px;background:#000c;color:var(--fg);font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;letter-spacing:.03em}
.tag.oculto{background:var(--coral);color:#2a0509}
.editar{position:absolute;top:8px;right:8px;border:0;background:var(--gold);color:#1d1503;font-weight:700;font-size:12px;padding:6px 10px;border-radius:999px}
.novo{display:grid;place-items:center;gap:6px;border:1.5px dashed var(--line);background:none;border-radius:var(--r);min-height:220px;color:var(--muted);font-weight:600}
.vazio{padding:48px 0;text-align:center;color:var(--muted)}

/* Rodapé */
footer{margin-top:40px;padding-block:22px;border-top:1px solid var(--line);color:var(--muted);font-size:14px;display:grid;gap:10px}
footer .zap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;color:var(--fg)}
.btn.prim{background:var(--turq);border-color:var(--turq);color:var(--turq-ink)}
.btn.ouro{background:var(--gold);border-color:var(--gold);color:#1d1503}
.btn.perigo{background:none;border-color:var(--coral);color:var(--coral)}
a.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}

/* Barra flutuante */
.barra{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background:linear-gradient(180deg,transparent,var(--bg) 30%)}
.barra .in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:16px;padding:10px 10px 10px 16px;box-shadow:0 10px 30px #000a}
.barra .txt{flex:1;min-width:0;line-height:1.25}
.barra .txt b{display:block}
.barra .txt span{color:var(--muted);font-size:13px}
.badge{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--coral);color:#2a0509;font-size:12px;font-weight:700;margin-right:6px;vertical-align:1px}

/* Painéis (detalhe, orçamento, edição) */
.fundo{position:fixed;inset:0;z-index:30;background:#000b;display:flex;align-items:flex-end;justify-content:center}
.painel{background:var(--surface);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;
  padding:18px max(18px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));display:grid;gap:14px}
@media (min-width:700px){.fundo{align-items:center}.painel{border-radius:20px;max-height:88%}}
.painel header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.painel h3{font-family:var(--display);font-weight:400;font-size:24px;margin:0;line-height:1.15;text-wrap:balance}
.fechar{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}
.foto-grande{background:var(--tile);border-radius:14px;display:grid;place-items:center;aspect-ratio:4/3;width:100%;min-width:0;flex-shrink:0;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
.foto-grande img{width:92%;height:94%;object-fit:contain;min-width:0;min-height:0}
.desc{color:#d7d0c2;white-space:pre-line;font-size:14px;max-width:65ch;margin:0}
.rapido{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rapido .btn{padding:7px 12px}
.acoes{display:flex;flex-wrap:wrap;gap:10px}
.acoes > *{flex:1 1 160px}
.lista{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.lista li{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;background:var(--surface-2);border-radius:12px;padding:8px}
.lista img{width:52px;height:52px;background:var(--tile);border-radius:8px;object-fit:contain;padding:4px}
.lista .n{font-size:14px;font-weight:600;min-width:0}
.lista .n small{display:block;color:var(--muted);font-weight:500}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:12px}
.total b{color:var(--gold-hi);font-size:20px}
.nota{color:var(--faint);font-size:13px;margin:0}
.totais{display:grid;gap:6px}
.sub-linha{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:14px}
.gestao-faixa{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-top:16px;background:var(--surface-2);border:1px solid var(--gold);border-radius:12px;padding:12px 14px}
.gestao-faixa b{display:block}
.gestao-faixa span{color:var(--muted);font-size:13px}
.fretes{display:grid;gap:8px}
.frete-cidade{display:grid;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px}
.frete-cidade .cidade-nome{font-family:var(--display);font-size:18px;color:var(--gold-hi);background:none;border-color:transparent;padding-inline:4px}
.btn.mini{justify-self:start;padding:6px 10px;font-size:13px}
.alerta{color:var(--coral)}
.marca-txt{flex:1;min-width:0}
.admin-linha{display:flex;justify-content:flex-end;padding-top:12px;margin-bottom:-10px}
.admin-pill{border:1px solid var(--gold);background:none;color:var(--gold-hi);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.admin-pill[aria-pressed="true"]{background:var(--gold);color:#1d1503}
.negocia{display:grid;gap:12px;border:1px solid var(--gold);border-radius:14px;padding:14px;background:var(--surface-2)}
.negocia h4{margin:0;font-family:var(--display);font-weight:400;font-size:19px;color:var(--gold-hi)}
.negocia h4 span{font-family:var(--body);font-size:12px;color:var(--faint);margin-left:6px;letter-spacing:.03em}
.riscado{color:var(--faint);margin-left:6px}
.cliente{display:grid;gap:12px}
.cliente h4{margin:0;font-family:var(--display);font-weight:400;font-size:19px;color:var(--fg)}
.opcoes{border:0;margin:0;padding:0;display:grid;gap:8px;min-width:0}
.opcoes legend{font-size:13px;color:var(--muted);padding:0;margin-bottom:6px}
.erro-msg{color:var(--coral);font-size:12.5px}
.progresso{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.progresso span{display:block;height:100%;background:var(--turq);transition:width .2s}
.preco.consulta{color:var(--turq);font-weight:600;font-size:14px}
.sem-foto{display:grid;place-items:center;width:100%;height:100%;color:#9a9284;font-size:13px;font-weight:600;letter-spacing:.03em;background:repeating-linear-gradient(135deg,#f3f0ea 0 10px,#ece8e0 10px 20px)}
.foto-grande .sem-foto{min-height:180px;border-radius:14px}
.tag.estoque{top:auto;bottom:8px;left:8px;background:#0b1f1e;color:var(--turq)}
.tag.estoque.pend{color:var(--muted);background:#000c}
.lista .n .alerta{display:block;color:var(--coral);font-weight:500}
.mini-vazio{width:52px;height:52px;border-radius:8px;background:repeating-linear-gradient(135deg,#f3f0ea 0 6px,#ece8e0 6px 12px)}
.resumo-sync{margin:0;padding-left:18px;display:grid;gap:6px}
.colab{display:grid;gap:8px;border:1px solid var(--line);border-radius:12px;padding:12px}
.colab-topo{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px}
.colab-topo span{color:var(--faint);font-size:12.5px}
.perms{display:grid;gap:8px}
.acoes-mini{display:flex;flex-wrap:wrap;gap:8px}
.aprovar{display:grid;gap:10px;border:1px solid var(--turq);border-radius:12px;padding:12px}
.aprovar h4{margin:0;font-family:var(--display);font-weight:400;font-size:18px;color:var(--turq)}
.recusa{display:grid;gap:10px;border:1px solid var(--coral);border-radius:12px;padding:12px}
.recusa h4{margin:0;font-family:var(--display);font-weight:400;font-size:18px;color:var(--coral)}
.recusa-ok{margin:0;color:#f3c3c8}
.aprovar > .btn.perigo{justify-self:start}
.ok-aprov{margin:0;color:var(--turq)}
.cau-neg{display:grid;gap:10px;border:1px solid var(--line);border-radius:12px;padding:12px}
.cau-lista{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.cau-linha{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--fg)}
.cau-linha span{min-width:0}
.cau-linha b{display:block;font-weight:600}
.cau-linha small{display:block;color:var(--muted);font-size:13px}
.cau-linha .num{flex:none;color:var(--gold-hi);font-weight:700}
.cau-foto{background:var(--tile);border-radius:12px;overflow:hidden}
.cau-foto img{display:block;width:100%;max-height:280px;object-fit:contain}
.cau-neg input[type=file],#cau-foto{font-size:14px}
.cep-info{color:var(--turq);font-size:12.5px;min-height:1em}
.neg-wrap{border-top:1px solid var(--line);padding-top:12px}
.neg-wrap > summary{cursor:pointer;font-weight:600;color:var(--gold-hi);padding:6px 0;list-style-position:inside}
.neg-wrap > summary span{font-weight:500;font-size:12px;color:var(--faint);margin-left:6px}
.neg-wrap[open] > summary{margin-bottom:12px}
.falta{margin:0;font-size:13.5px;color:var(--coral);background:#2a1216;border-radius:10px;padding:10px 12px}
.falta.ok{color:var(--turq);background:#0f2e2d}
.btn.enviar{font-size:16px;padding:13px 16px}
.btn.bloqueado{background:var(--surface-2);border-color:var(--line);color:var(--faint)}
.sub-titulo{margin:0;font-size:14px;color:var(--muted);font-weight:600}
.lista.forn li{grid-template-columns:28px 1fr 64px}
.fo-q{width:64px;text-align:center;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 4px;font-size:16px;color:var(--fg)}
.add-mais{display:grid;gap:10px;border:1px dashed var(--line);border-radius:12px;padding:10px}
.enviado{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;background:#0f2e2d;border:1px solid var(--turq);border-radius:12px;padding:10px 12px}
.enviado b{display:block;color:var(--turq)}
.enviado span{color:var(--muted);font-size:13px}
.modo{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px}
.modo button{border:0;background:none;border-radius:9px;padding:10px 8px;font-weight:600;color:var(--muted)}
.modo button[aria-checked="true"]{background:var(--gold);color:#1d1503}
.galpao{display:grid;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}
.galpao b{color:var(--gold-hi)}
.galpao span{color:var(--muted);font-size:13.5px}
.sel{user-select:all}
.mapa{color:var(--turq);font-weight:600;font-size:14px;text-decoration:none;justify-self:start}
.loja{display:grid;gap:3px}
.loja b{color:var(--fg)}
.terreo{display:grid;gap:6px;background:var(--bg);border:1px solid var(--turq);border-radius:12px;padding:12px}
.terreo b{color:var(--turq)}
.terreo span{color:var(--muted);font-size:13.5px}
.frete-linha{display:grid;grid-template-columns:minmax(0,1fr) 110px 36px;gap:8px;align-items:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.campos{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.campos .full{grid-column:1/-1}
@media (max-width:480px){.campos{grid-template-columns:1fr}}
label.f{display:grid;gap:5px;font-size:13px;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;color:var(--fg);width:100%;min-width:0}
label.f textarea{min-height:130px;resize:vertical;font-size:15px}
.check{display:flex;align-items:center;gap:10px;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--turq)}
.foto-edit{display:flex;gap:12px;align-items:center}
.foto-edit img{width:84px;height:84px;background:var(--tile);border-radius:10px;object-fit:contain;padding:6px}
.confirma{background:#3a1218;border:1px solid var(--coral);border-radius:12px;padding:12px;display:grid;gap:10px}
.aviso{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top, 0px));box-shadow:0 8px 24px #000a;z-index:40;background:var(--fg);color:var(--bg);
  padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:no-preference){.fundo.entra{animation:fade .18s ease}.fundo.entra .painel{animation:sobe .22s ease}}
@keyframes fade{from{opacity:0}}
@keyframes sobe{from{transform:translateY(24px)}}
</style>
</head>

function lerFretes(){
  var p = estado.painel, cidades = cidadesDe(p.linhas), novos = {};
  cidades.forEach(function(c, ci){ var el = document.getElementById("fc-" + ci); novos[c] = el ? el.value : c; });
  p.linhas.forEach(function(f, i){
    var b = document.getElementById("fb-" + i), v = document.getElementById("fv-" + i);
    if (b) f.bairro = b.value; if (v) f.valor = v.value;
    if (novos.hasOwnProperty(f.cidade)) f.cidade = novos[f.cidade];
  });
  var c = document.getElementById("f-colar"); if (c) p.colar = c.value;
  var n = document.getElementById("f-nao"); if (n) p.nao = n.value;
}
function colarFretes(){
  lerFretes();
  var p = estado.painel, ok = 0, ruins = [], cidade = "";
  var cs = cidadesDe(p.linhas); cidade = cs[0] || "Nova Iguaçu";
  function poe(nome, v){
    nome = nome.replace(/^[\s*\-•]+|[\s*.;:]+$/g, "").trim(); if (!nome) return;
    var achou = p.linhas.filter(function(f){ return f.cidade === cidade && norm(f.bairro) === norm(nome); })[0];
    if (achou) achou.valor = v; else p.linhas.push({ cidade: cidade, bairro: nome, valor: v });
    ok++;
  }
  String(p.colar || "").split(/\n/).forEach(function(l){
    var linha = l.replace(/\*/g, "").trim(); if (!linha) return;
    var m;
    if ((m = linha.match(/^[-•\s]*R\$\s*(\d[\d.]*(?:,\d{1,2})?)\s*[:\-–]\s*(.+)$/i))){ var v = parseBRL(m[1]); m[2].split(/,|;| e (?=[A-ZÁÉÍÓÚ])/).forEach(function(b){ poe(b, v); }); return; }
    if ((m = linha.match(/^(.*?)[\s;:\t|–—-]+(?:R\$\s*)?(\d[\d.]*(?:,\d{1,2})?)\s*$/i)) && m[1].trim()){ poe(m[1], parseBRL(m[2])); return; }
    if ((m = linha.match(/^([^:]{2,60}):\s*$/))){ cidade = m[1].replace(/^[-•\s]+/, "").trim(); return; }
    ruins.push(l.trim());
  });
  p.colar = ruins.join("\n");
  p.erro = ruins.length ? "Não entendi " + ruins.length + (ruins.length === 1 ? " linha" : " linhas") + " (ficaram no campo)." : "";
  p.linhas = ordenarFretes(p.linhas);
  render(); if (ok) aviso(ok + (ok === 1 ? " bairro adicionado ou atualizado" : " bairros adicionados ou atualizados"));
}
function salvarFretes(){
  lerFretes();
  var p = estado.painel, lista = [], vistos = {};
  for (var i = 0; i < p.linhas.length; i++){
    var f = p.linhas[i], nome = String(f.bairro || "").trim(), cid = String(f.cidade || "").trim();
    if (!nome && (f.valor === "" || f.valor == null)) continue;
    var v = parseBRL(f.valor);
    if (!cid){ p.erro = "Há uma cidade sem nome."; return render(); }
    if (!nome){ p.erro = "Há um frete sem nome de bairro em " + cid + "."; return render(); }
    if (!(v >= 0)){ p.erro = "Valor inválido em “" + nome + "” (" + cid + "). Use números, por exemplo 40,00."; return render(); }
    var k = norm(cid) + "|" + norm(nome);
    if (vistos[k]){ p.erro = "“" + nome + "” aparece duas vezes em " + cid + "."; return render(); }
    vistos[k] = true; lista.push({ cidade: cid, bairro: nome, valor: Math.round(v * 100) / 100 });
  }
  DADOS.fretes = ordenarFretes(lista);
  DADOS.naoAtendidos = String(p.nao || "").split(/[,\n]/).map(function(x){ return x.trim(); }).filter(Boolean);
  estado.pendentes++;
  fechar(); aviso("Fretes salvos. Publique para os clientes verem.");
}

function foneCliente(){ var d = String(estado.cli.fone || "").replace(/\D/g, ""); if (d.length === 10 || d.length === 11) d = "55" + d; return d.length >= 12 ? d : ""; }
function proposta(){
  var r = resumo(), n = estado.neg, en = r.entrega;
  var negFrete = String(n.frete || "").trim() ? parseBRL(n.frete) : null;
  if (negFrete != null && !(negFrete >= 0)) negFrete = null;
  var tabela = en.tipo === "bairro" || en.tipo === "retirada" ? en.frete : null;
  var frete = negFrete != null ? negFrete : (tabela || 0);
  var desc = parseBRL(n.desconto); if (!(desc > 0)) desc = 0;
  return { r: r, en: en, negFrete: negFrete, tabela: tabela, frete: frete, desconto: desc, total: Math.max(0, r.itens + frete - desc), aCombinar: negFrete == null && tabela == null };
}
/* Caução de limpeza: valor opcional por pedido, separado do controle de avarias do sistema. */
function arred(v){ return Math.round(Number(v) * 100) / 100; }
function errosCaucao(){

function fotoParaBlob(file){

    var url = URL.createObjectURL(file), img = new Image();

      var c = document.createElement("canvas"); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      var g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(function(b){ if (b) ok(b); else falha(); }, "image/jpeg", 0.82);
    };
    img.onerror = function(){ URL.revokeObjectURL(url); falha(); };
    img.src = url;
  });
}

function sqlAprovar(){

    "it as (insert into itens (codigo, nome, preco) select codigo, nome, preco::numeric from v on conflict (codigo) do update set nome = excluded.nome, preco = excluded.preco returning id, codigo), " +
    "ped as (insert into pedidos (cliente_id, status, data_inicio, data_fim, tipo_saida, endereco, valor_itens, valor_frete, desconto, valor_caucao, origem, observacoes) select cli.id, 'reservado', " +

    "pi as (insert into pedido_itens (pedido_id, item_id, quantidade, preco_unit, periodos) select ped.id, it.id, v.qtd, v.preco::numeric, 1 from ped, v join it on it.codigo = v.codigo returning 1) " +
    "select (select numero from ped) as numero, (select count(*) from pi) as itens;";
}

var TIPOS_PIX = [["cnpj", "CNPJ"], ["cpf", "CPF"], ["celular", "Celular"], ["email", "E-mail"], ["aleatoria", "Chave aleatória"]];
function semAcento(t){ return String(t || "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9 &.\-]/g, "").toUpperCase().trim(); }
function pixChave(pg){
  var c = String(pg.chave || "").trim(), d = soDigitos(c);
  if (pg.tipo === "cpf") return d.length === 11 ? d : "";
  if (pg.tipo === "cnpj") return d.length === 14 ? d : "";
  if (pg.tipo === "celular"){ if (d.length === 10 || d.length === 11) d = "55" + d; return d.length === 12 || d.length === 13 ? "+" + d : ""; }
  if (pg.tipo === "email") return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c) ? c.toLowerCase() : "";
  if (pg.tipo === "aleatoria") return /^[0-9a-fA-F-]{32,36}$/.test(c) ? c.toLowerCase() : "";
  return "";
}
function pixChaveTexto(pg){
  var k = pixChave(pg), d = soDigitos(k);
  if (!k) return "";
  if (pg.tipo === "cpf") return d.replace(/^(\d{3})(\d{3})(\d{3})(\d{2})$/, "$1.$2.$3-$4");
  if (pg.tipo === "cnpj") return d.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/, "$1.$2.$3/$4-$5");
  if (pg.tipo === "celular") return telFmt(d.slice(2));

}
function linkValido(l){ return /^https:\/\/[^\s]+\.[^\s]+$/.test(String(l || "").trim()); }
function emv(id, v){ v = String(v); return id + (v.length < 10 ? "0" : "") + v.length + v; }
function crc16(t){
  var c = 0xFFFF;
  for (var i = 0; i < t.length; i++){ c ^= t.charCodeAt(i) << 8; for (var j = 0; j < 8; j++) c = (c & 0x8000) ? ((c << 1) ^ 0x1021) & 0xFFFF : (c << 1) & 0xFFFF; }
  return ("0000" + c.toString(16).toUpperCase()).slice(-4);
}
function pixCopiaCola(valor, txid){
  var k = pixChave(pagamento); if (!k) return "";
  var nome = semAcento(pagamento.nome || "M&A LOCACAO").slice(0, 25) || "M&A LOCACAO", cid = semAcento(pagamento.cidade || "NOVA IGUACU").slice(0, 15) || "NOVA IGUACU";
  var t = emv("00", "01") + emv("26", emv("00", "br.gov.bcb.pix") + emv("01", k)) + emv("52", "0000") + emv("53", "986") +
    (valor > 0 ? emv("54", valor.toFixed(2)) : "") + emv("58", "BR") + emv("59", nome) + emv("60", cid) +
    emv("62", emv("05", (String(txid || "").replace(/[^A-Za-z0-9]/g, "").slice(0, 25)) || "***")) + "6304";
  return t + crc16(t);
}

var MINUSC = { DE:1, DA:1, DO:1, DAS:1, DOS:1, COM:1, EM:1, E:1, PARA:1, A:1, O:1, AS:1, OS:1, SEM:1, NO:1, NA:1 };
function bonito(nome){
  return String(nome || "").split(" ").map(function(tok, i){
    var m = tok.match(/^([(\["“]*)(.*?)([)\]"”,.;:]*)$/), a = m[1], core = m[2], z = m[3], up = core.toUpperCase();
    if (!core) return tok;
    var cap = function(w){ return w.charAt(0).toUpperCase() + w.slice(1).toLowerCase(); };
    if (/\d/.test(core)) core = up;
    else if (up === "ML" || up === "CM" || up === "MM") core = up.toLowerCase();
    else if (up === "L" || up === "V") core = up;
    else if (up === "M") core = "m";
    else if (up === "Nº") core = "nº";
    else if (up === "II" || up === "III" || (core.length <= 3 && !/[AEIOUÁÉÍÓÚÂÊÔÃÕ]/.test(up))) core = up;
    else if (MINUSC[up] && i > 0) core = up.toLowerCase();
    else if (core.indexOf("/") >= 0) core = core.split("/").map(cap).join("/");
    else if (core.indexOf("-") >= 0) core = core.split("-").map(cap).join("-");
    else core = cap(core);
    return a + core + z;
  }).join(" ");
}

var FOTO_MAX = 1000, FOTO_Q = 0.8;
function comprimirFoto(dataUrl){
  return new Promise(function(ok, falha){
    var img = new Image();
    img.onload = function(){
      var esc1 = Math.min(1, FOTO_MAX / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * esc1); c.height = Math.round(img.height * esc1);
      var g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      var w = c.toDataURL("image/webp", FOTO_Q);
      if (w.indexOf("data:image/webp") !== 0){
        var esc2 = Math.min(1, 800 / Math.max(img.width, img.height)); c.width = Math.round(img.width * esc2); c.height = Math.round(img.height * esc2);
        g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
        w = c.toDataURL("image/jpeg", 0.8);
      }
      ok(w);
    };
    img.onerror = falha; img.src = dataUrl;
  });
}

function importarPedido(){
  var p = estado.painel, txt = (document.getElementById("f-pedido") || {}).value || "";
  p.texto = txt;
  var novo = {}, ok = 0, falhas = [], sel = "", outro = "", evento = "", codigo = "", cli = { nome: "", fone: "", doc: "", cep: "", endereco: "", mesmo: true, cepEnt: "", entrega: "", terreo: "", andar: "", obs: "" };
  txt.split(/\n/).forEach(function(l){
    var m, linha = l.trim();
    if ((m = linha.match(/^Observação do cliente:\s*(.*)$/))){ cli.obs = m[1]; return; }
    if ((m = linha.match(/^[•\-*]?\s*(\d+)\s*[×x]\s*(.+?)\s+[—–-]\s+(?:R\$|preço sob consulta)/))){
      var cod = (m[2].match(/\[([A-Z0-9-]+)\]\s*$/) || [])[1], nome = norm(m[2].replace(/\s*\[[A-Z0-9-]+\]\s*$/, ""));
      var it = (cod && item(cod)) || DADOS.itens.filter(function(x){ return norm(x.nome) === nome; })[0];
      if (it){ novo[it.id] = (novo[it.id] || 0) + Number(m[1]); ok++; } else falhas.push(m[2]);
      return;
    }
    if ((m = linha.match(/^(?:Frete|Entrega grátis)\s*\((.+?)\s+–\s+(.+?)\)/))){
      var f = DADOS.fretes.filter(function(x){ return norm(x.bairro) === norm(m[1]) && norm(x.cidade) === norm(m[2]); })[0];
      if (f) sel = chaveFrete(f); else { sel = "outro"; outro = m[1] + ", " + m[2]; }
      return;
    }
    if ((m = linha.match(/^Entrega em (.+?): frete a combinar/))){ sel = "outro"; outro = m[1]; return; }
    if (/^Retirada no (local|galpão)/.test(linha)){ sel = "retirada"; return; }
    if ((m = linha.match(/Data do evento:\s*(\d{2})\/(\d{2})\/(\d{4})/))){ evento = m[3] + "-" + m[2] + "-" + m[1]; return; }
    if ((m = linha.match(/pedido (MA-[A-Z0-9]{4,6})/))) codigo = m[1];
    if ((m = linha.match(/^Nome:\s*(.+)$/))){ cli.nome = m[1]; return; }
    if ((m = linha.match(/^CPF\/CNPJ:\s*(.+)$/))){ cli.doc = m[1]; return; }
    if ((m = linha.match(/^WhatsApp:\s*(.+)$/))){ cli.fone = m[1]; return; }
    if ((m = linha.match(/^Endereço:\s*(.+)$/))){ var mc = m[1].match(/^(.*?)\s*–\s*CEP\s*(\d{5}-?\d{3})/); if (mc){ cli.endereco = mc[1]; cli.cep = fmtCep(mc[2]); } else cli.endereco = m[1]; return; }
    if ((m = linha.match(/^Entrega:\s*(.+)$/))){ var ent = m[1].split(" – ")[0].trim(); if (/^no mesmo endereço$/i.test(ent)) cli.mesmo = true; else { cli.mesmo = false; var me = ent.match(/^(.*?),\s*CEP\s*(\d{5}-?\d{3})$/); if (me){ cli.entrega = me[1]; cli.cepEnt = fmtCep(me[2]); } else cli.entrega = ent; } return; }
    if (/^(?:Entrega no térreo|Térreo):/i.test(linha)){ cli.terreo = "sim"; return; }
  });
  if (!ok){ p.erro = "Não encontrei itens do catálogo nessa mensagem. Cole o texto completo que o cliente enviou."; return render(); }
  estado.carrinho = novo; salvarCarrinho();
  if (sel){ estado.bairroSel = sel; estado.bairroOutro = outro; salvarEntrega(); }
  if (evento) estado.evento = evento;
  estado.neg = { fone: "", frete: "", desconto: "", obs: "", codigo: codigo };
  estado.cli = cli; estado.validar = false; estado.negAberta = true;
  estado.gestao = false;
  abrir({ tipo: "orcamento" });
  aviso(ok + (ok === 1 ? " item carregado" : " itens carregados") + (falhas.length ? ". Não achei: " + falhas.join(", ") : ""));
}

function aviso(txt){
  var a = document.createElement("div"); a.className = "aviso"; a.setAttribute("role", "status"); a.textContent = txt;
  document.body.appendChild(a); setTimeout(function(){ a.remove(); }, 2600);
}
function copiar(txt, ok){
  var feito = function(){ aviso(ok); };
  try {
    navigator.clipboard.writeText(txt).then(feito, function(){ selecionar(txt); });
  } catch (e) { selecionar(txt); }
}
function selecionar(txt){
  var t = document.createElement("textarea"); t.value = txt; t.setAttribute("readonly", ""); t.style.position = "fixed"; t.style.opacity = "0";
  document.body.appendChild(t); t.select();
  var ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
  t.remove(); aviso(ok ? "Copiado" : "Não foi possível copiar. Selecione o texto manualmente.");
}

function slug(s){ return norm(s).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "categoria"; }

function salvarItem(){
  lerRascunho();
  var p = estado.painel, d = p.rascunho;
  var preco = parseFloat(String(d.preco).replace(/\./g, "").replace(",", "."));
  if (!d.nome.trim()){ p.erro = "Dê um nome ao item."; return render(); }
  if (!(preco >= 0)){ p.erro = "Preço inválido. Use números, por exemplo 12,50."; return render(); }
  var cat = d.categoria;
  if (cat === "__nova"){
    if (!(d.novaCat || "").trim()){ p.erro = "Escreva o nome da nova categoria."; return render(); }
    cat = slug(d.novaCat); var base = cat, k = 2;
    while (DADOS.categorias.some(function(c){ return c.id === cat; })) cat = base + "-" + (k++);
    DADOS.categorias.push({ id: cat, nome: d.novaCat.trim() });
  }
  var novo = { id: p.novo ? "NOVO-" + Date.now().toString(36).toUpperCase() : p.id, nome: d.nome.trim(), categoria: cat, preco: Math.round(preco * 100) / 100,
    unidade: d.unidade, descricao: d.descricao.trim(), foto: d.foto || "", publicado: d.publicado,
    precoPendente: !!d.precoPendente && !(preco > 0), estoque: soDigitos(d.estoqueTxt != null ? d.estoqueTxt : d.estoque).length ? parseInt(soDigitos(d.estoqueTxt != null ? d.estoqueTxt : d.estoque), 10) : 0,
    contagemPendente: !soDigitos(d.estoqueTxt != null ? d.estoqueTxt : (d.contagemPendente ? "" : d.estoque)).length };
  if (p.novo) DADOS.itens.push(novo);
  else DADOS.itens = DADOS.itens.map(function(it){ return it.id === p.id ? novo : it; });
  estado.pendentes++;
  fechar(); aviso(p.novo ? "Item adicionado. Publique para os clientes verem." : "Alteração salva. Publique para os clientes verem.");
}

function reduzirFoto(file){
  return new Promise(function(ok, falha){
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function(){
      var max = 480, s = Math.min(1, max / Math.max(img.width, img.height));
      var c = document.createElement("canvas"); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      var g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); ok(c.toDataURL("image/jpeg", 0.82));
    };
    img.onerror = function(){ URL.revokeObjectURL(url); falha(); };
    img.src = url;
  });
}

var RESET_PADRAO = ":root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}";
function montarPagina(){
  var reset = "", st = document.head.querySelectorAll("style");
  for (var i = 0; i < st.length; i++) if (!st[i].id) { reset = st[i].textContent; break; }
  if (!reset) reset = RESET_PADRAO;
  var fontes = document.querySelector('link[href*="fonts.googleapis.com"]');
  var dados = JSON.parse(JSON.stringify(DADOS));
  var hoje = new Date(); dados.atualizado = hoje.getFullYear() + "-" + String(hoje.getMonth() + 1).padStart(2, "0") + "-" + String(hoje.getDate()).padStart(2, "0");
  var fim = "</" + "script>";
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + reset + '</style></head><body>' +
    '<title>Catálogo M&amp;A Locação</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n' +
    (fontes ? fontes.outerHTML : "") + '\n<style id="app-css">' + document.getElementById("app-css").textContent + '</style>\n<div id="app"></div>\n' +
    '<script type="application/json" id="catalogo-dados">' + JSON.stringify(dados).replace(/</g, "\\u003c") + fim + '\n' +
    '<script id="app-js">' + document.getElementById("app-js").textContent + fim + '</body></html>';
}

function publicar(){
  if (!artifactNs){ estado.somenteLeitura = true; render(); return; }
  var b = document.querySelector('[data-a="publicar"]'); if (b){ b.disabled = true; b.textContent = "Publicando…"; }
  artifactNs.publish(montarPagina()).then(function(){
    estado.pendentes = 0; aviso("Catálogo publicado");
  }, function(err){
    var c = err && err.code;
    if (c === "conflict") return;
    if (c === "not_writer" || c === "not_granted" || c === "not_declared" || c === "consent_required" || c === "capability_disabled" || c === "capability_removed"){ estado.somenteLeitura = true; render(); aviso("Esta visualização é só leitura"); return; }
    if (c === "too_large"){ render(); aviso("O catálogo ficou grande demais. Use fotos menores."); return; }
    if (c === "rate_limited"){ render(); aviso("Muitas publicações seguidas. Aguarde um minuto e tente de novo."); return; }
    render(); aviso("Não foi possível publicar agora. Tente de novo em instantes.");
  });
}

app.addEventListener("change", function(ev){
